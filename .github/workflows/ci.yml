name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Python — lint, format, types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --python 3.12
      - name: ruff check
        run: uv run ruff check --no-fix src scripts tests
      - name: ruff format --check
        run: uv run ruff format --check src scripts tests
      - name: mypy
        run: uv run mypy

  python:
    name: Python — test
    runs-on: ubuntu-latest
    # No DEEPSEEK_API_KEY here, deliberately. `Settings` boots keyless and
    # `require_deepseek_api_key()` raises only when a call would actually reach
    # the model, so the absence of a key is itself part of what CI verifies:
    # every test is stubbed and none of them touch the network.
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --python 3.12
      - name: pytest
        run: uv run pytest tests -q

  eval-gate:
    name: Eval regression gate
    runs-on: ubuntu-latest
    # The load-bearing gate. Prediction CSVs are committed, so the champion's
    # accuracy can be re-scored deterministically with zero API calls. A prompt
    # change that quietly degrades the champion — or flips any case that used to
    # pass — cannot merge.
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --python 3.12
      - name: Re-score committed predictions against the champion floor
        run: uv run python -m convfinqa.tracking.gate

  frontend:
    name: Frontend — type, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:unit
      - name: Build
        run: npm run build
      # Playwright e2e (npm run test:e2e) needs a running backend and a browser
      # download; it stays a local target.

  docker:
    name: Docker — build the demo image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  terraform:
    name: Terraform — fmt & validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: fmt
        run: terraform fmt -check -recursive infra/
      - name: validate (no backend — plan needs AWS creds, this does not)
        working-directory: infra/terraform/demo
        run: |
          terraform init -backend=false -input=false
          terraform validate
