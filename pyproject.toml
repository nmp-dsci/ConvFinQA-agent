[project]
name = "confinqa-agent"
version = "0.1.0"
description = "ConfinQA assignment data processing and assessment"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.136,<0.137",
  "httpx>=0.28,<0.29",
  "typer==0.12.0",
  "click==8.1.7",
  "questionary>=2.1.1",
  "dotenv>=0.9.9",
  "pandas>=2.2.3",
  "pydantic>=2.11.4",
  "pydantic-settings>=2.0",
  "ruff>=0.11.10",
  "mypy>=1.15.0",
  "pydantic-ai>=0.2",
  "logfire[fastapi,httpx,pydantic-ai]>=3.0.0",
  "tenacity>=8.0.0",
  "dspy>=2.5",
  "mlflow>=3.11.1",
  "uvicorn>=0.41,<0.42",
  "claude-agent-sdk>=0.2.152",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/convfinqa", "scripts"]

[project.scripts]
convfinqa-eval = "scripts.evaluate:main"
convfinqa-eval-api = "scripts.evaluate_api:main"
convfinqa-optimize = "scripts.optimize:main"
convfinqa-serve = "scripts.serve:main"
convfinqa-diagnose = "convfinqa.diagnosis.cli:main"
convfinqa-mlflow = "convfinqa.tracking.cli:main"
convfinqa-evalloop = "convfinqa.evalloop.cli:main"
convfinqa-demo-pack = "convfinqa.serving.demo_pack.cli:main"


[tool.ruff]
fix = true
unsafe-fixes = false

[tool.ruff.lint]
select = [
    "F",  # default Ruff rules
    "E",  # pycodestyle Errors
    "W",  # pycodestyle Warnings
    "I",  # import sorting
    "UP", # modern syntax updates
    "B",  # flake8 common pitfalls & best practices
    "Q",  # flake8 consistent quotes
    "N",  # naming conventions,
]

ignore = [
    "B008",
    "D413",
    "E501",
    "W293",
    "W291",
    "PLR2004",
    "D101",
    "D400",

]

fixable = ["ALL"]

extend-select = [
    "PLR2004",
    "D101",
    "D102",
    "D103",
    "D201",
    "D202",
    "D215",
    "T201",
]

[tool.ruff.lint.per-file-ignores]
# Tests document themselves through their names; docstring rules add noise
# without adding information. `print` is legitimate output in CLI scripts.
"tests/**" = ["D101", "D102", "D103"]
# `print` is the output of a command-line tool, not a stray debug statement.
"scripts/**" = ["T201"]
"src/convfinqa/**/cli.py" = ["T201"]
"src/convfinqa/tracking/gate.py" = ["T201"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
disallow_any_generics = true
disallow_untyped_defs = true
disallow_untyped_globals = true
ignore_missing_imports = true
show_error_codes = true
strict = false
warn_return_any = true
plugins = ['pydantic.mypy']
# `packages = ["src"]` looked right but silently defeated the whole check:
# `src` is not the package, `src/convfinqa` is. Every intra-package import
# then fell through `ignore_missing_imports` and resolved to Any, so the
# strictest settings above applied to almost nothing.
mypy_path = "src"
packages = ["convfinqa"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]
