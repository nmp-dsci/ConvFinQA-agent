# s33 P5: the DPO pilot. Policy and frozen reference both start at sft2-e1 (sft2's
# checkpoint-58, val 76.4%, test 100 81.4%). Data: 400 of s35's 2,306 rendered train
# pairs (cap 4, strict chosen), a seeded draw, and all 100 eval-slice pairs.
# Checkpoints every half-epoch; each is served and scored on sft_v1 val. Test 100 stays closed.
label: dpo1-pilot
base_model: Qwen/Qwen3-4B-Instruct-2507
revision: cdbee75f17c01a7cc42f958dc650907174af0554
dataset: dpo_v1_pilot
init_adapter: 20261025T113733Z_train_sft2/checkpoints/checkpoint-58
dpo:
  beta: 0.1
  nll_alpha: 1.0          # Pang et al.'s RPO term on the chosen, length-normalised
  learning_rate: 2.0e-5
  warmup_ratio: 0.05
  num_train_epochs: 2
  gradient_accumulation_steps: 16
  max_grad_norm: 1.0
  save_fractions: [0.25, 0.5, 0.75, 1.0]   # every half-epoch
  seed: 2035
